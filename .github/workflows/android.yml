```yaml
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "football_game_v2/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Verificar configuración
        working-directory: football_game_v2
        run: |
          grep -E '^(android.api|android.minapi|android.ndk_api|requirements)' buildozer.spec
          buildozer --version

      - name: Compilar APK
        working-directory: football_game_v2
        env:
          P4A_RELEASE_KEYSTORE: ""
        run: |
          buildozer android debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: football-career-apk
          path: football_game_v2/bin/*.apk
          if-no-files-found: error
          retention-days: 7
